<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

       
        body {
            display: grid;
            grid-template-rows: auto 1fr auto;
            grid-template-areas:
                "header"
                "article"
                "footer";
            min-height: 100vh;
        }

        
        header {
            grid-area: header;
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            padding: 15px 60px;
            background: #7b2d7f;
            color: white;
        }
          

        
     
      
        .menu {
            display: flex;
            gap: 25px;
            list-style: none;
        }
        .trs:hover { 
            transition-property: letterspacing;
             letter-spacing: 2px;
             transition-delay: 3s;
          
          }

        .menu a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .menu a:hover {
            text-decoration: underline;
        }

    
        article {
            grid-area: article;
        }

        .hero {
            display: grid;
            justify-items: center;
            gap: 15px;
            padding: 80px 20px;
            background: #eee6ef;
            text-align: center;
        }
        .hero:hover{
            background-color: rgb(198, 206, 240);
        }

        .hero button {
            padding: 12px 24px;
            margin-top: 10px;
            background: #2b0a33;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            
        }
        .articles {
            display: grid;
            justify-items: center;
            gap: 30px;
            padding: 50px 20px;
        }
        
        .cards {
            display: grid;
            grid-template-columns:1fr 1fr 1fr;
            justify-content: center;
            gap: 25px;
        }
        .card:hover{
            transition-property:width;
            width: 500px;
            background-color: rgb(197, 150, 240);
            transition-delay: 2s;
            transition-duration: 1s;
        }

        .card {
            padding: 25px 15px;
            background: white;
            text-align: center;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .card h3 {
            margin-bottom: 10px;
        }

       
        footer {
            grid-area: footer;
            padding: 20px;
            background: #7b2d7f;
            color: white;
            text-align: center;
            
        }
    </style>
</head>

<body>
    <header>
        <div class="trs">
        <h1>Creative Space</h1>
        </div>
        <ul class="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">Articles</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </header>

    <article>
        <section class="hero">
            <h1>Welcome to Our Website</h1>
            <p>Learn, Create and Grow with Us!</p>
            <button>Explore More</button>
        </section>

        <section class="articles">
            <h2>Our Articles</h2>
            <div class="cards">
                <div class="card">
                    <h3>HTML</h3>
                    <p>Build the structure of a website.</p>
                </div>
                <div class="card">
                    <h3>CSS</h3>
                    <p>Make your website beautiful.</p>
                </div>
                <div class="card">
                    <h3>JavaScript</h3>
                    <p>Make your website interactive.</p>
                </div>
            </div>
        </section>
    </article>

    <footer>
        @ 2026 Creative Space | Learn Something New
    </footer>
</body>
</html>
